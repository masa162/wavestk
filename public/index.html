<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavestk - Audio Upload</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="container mx-auto px-4 py-8 max-w-4xl">
    <!-- Header -->
    <header class="mb-8">
      <h1 class="text-3xl font-bold text-gray-800">wavestk</h1>
      <p class="text-gray-600 mt-2">Universal Audio CDN on Cloudflare</p>
      <nav class="mt-4">
        <a href="/" class="text-blue-600 font-semibold mr-4">Upload</a>
        <a href="/library.html" class="text-gray-600 hover:text-blue-600">Library</a>
      </nav>
    </header>

    <!-- Upload Card -->
    <div class="bg-white rounded-lg shadow-md p-6">
      <h2 class="text-2xl font-bold mb-4">Upload Audio Files</h2>

      <!-- Dropzone -->
      <div id="dropzone" class="border-2 border-dashed border-gray-300 rounded-lg p-12 text-center cursor-pointer hover:border-blue-500 transition-colors">
        <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path>
        </svg>
        <p class="mt-2 text-sm text-gray-600">
          Drag & drop audio files here<br>
          or <span class="text-blue-600 font-semibold">click to select</span>
        </p>
        <p class="mt-1 text-xs text-gray-500">
          MP3, M4A, AAC, WAV, OGG, Opus, FLAC, WebM (max 100MB)
        </p>
      </div>

      <input type="file" id="fileInput" accept="audio/*" multiple class="hidden">

      <!-- File List -->
      <div id="fileList" class="mt-4 hidden">
        <h3 class="text-sm font-medium text-gray-700 mb-2">Selected Files</h3>
        <div id="fileListContent" class="bg-gray-50 rounded p-3 max-h-40 overflow-y-auto text-sm"></div>
      </div>

      <!-- Upload Button -->
      <button id="uploadBtn" class="mt-6 w-full bg-blue-600 text-white py-3 px-4 rounded-md hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors" disabled>
        Start Upload
      </button>

      <!-- Progress -->
      <div id="progress" class="mt-4 hidden">
        <div class="flex justify-between text-sm text-gray-600 mb-1">
          <span id="progressText">Uploading...</span>
          <span id="progressCount">0 / 0</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2.5">
          <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full transition-all" style="width: 0%"></div>
        </div>
      </div>

      <!-- Success Message -->
      <div id="success" class="mt-4 hidden">
        <div class="bg-green-50 border border-green-200 rounded-md p-4">
          <h3 class="text-green-800 font-semibold mb-2">Upload Successful!</h3>
          <p class="text-sm text-green-700 mb-3">
            <span id="successCount"></span> audio file(s) uploaded.
          </p>
          <div id="uploadedUrls" class="space-y-2"></div>
          <a href="/library.html" class="text-blue-600 hover:underline text-sm mt-3 inline-block">
            View Library →
          </a>
        </div>
      </div>

      <!-- Error Message -->
      <div id="error" class="mt-4 hidden">
        <div class="bg-red-50 border border-red-200 rounded-md p-4">
          <h3 class="text-red-800 font-semibold mb-2">Error</h3>
          <p class="text-sm text-red-700" id="errorMessage"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="/script.js"></script>
</body>
</html>
